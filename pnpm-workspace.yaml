allowBuilds:
  esbuild: true
  sharp: true
  # Platform bindings are optional dependencies in the frozen lockfile.
  unrs-resolver: false

minimumReleaseAgeExclude:
  - "@ai-sdk/*"
  - "@rolldown/*"
  - "@vercel/*"
  - "@workflow/*"
  - ai
  - experimental-ai-sdk-code-mode
  - eve
  - nitro
  - rolldown
  - workflow
  - '@abloatai/ablo@0.67.3'
  - '@abloatai/cli@0.67.3'
  - '@abloatai/humans@0.67.3'
  - '@abloatai/transaction@0.67.3'

# Security fixes for transitive dependencies whose parent pins a vulnerable
# version exactly. Remove each entry once the parent ships the fix.
overrides:
  # drizzle-kit still declares @esbuild-kit/esm-loader, whose core-utils pins esbuild ~0.18.20.
  '@esbuild-kit/core-utils>esbuild': ^0.25.0
